<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11121A">
<title>Fatura do Cartão</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23F06BAA%22/%3E%3Cpath d=%22M16 2a14 14 0 0 1 12 21L16 16z%22 fill=%22%23F2BE4A%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabeçalho, resumo do mês em lavanda com um cartão por pessoa, gráfico dos meses, lançamentos agrupados e histórico das faturas. */
:root{
  color-scheme:dark;
  --bg:#11121A; --surface:#1B1C27; --ink:#F2F2F7; --muted:#A3A4B5; --faint:#6E7083;
  --line:#2C2E3C; --sel:#272938; --soft:#22232F; --accent:#F06BAA; --accenti:#1A0710;
  --hero1:#1B1C27; --hero2:#1B1C27; --tile:#232431;
  --p1:#F06BAA; --p1i:#1A0710; --p2:#F2BE4A; --p2i:#2B1D00; --p3:#3FD0BF; --p3i:#04292C; --p4:#9C8CFF; --p4i:#14103A;
  --p5:#7FB0F5; --p5i:#0B1D3A; --p6:#6FCB91; --p6i:#0B2A17; --p7:#F28A76; --p7i:#3A0F07; --p8:#C9B6E8; --p8i:#231A3A;
  --p0:#5A5C6E; --p0i:#F2F2F7; --warn:#F2BE4A; --warnbg:#2A2416;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.3);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:20px 56px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
#main{width:100%;min-width:0}
.num{font-variant-numeric:tabular-nums}
.c1{--c:var(--p1);--ci:var(--p1i)}.c2{--c:var(--p2);--ci:var(--p2i)}.c3{--c:var(--p3);--ci:var(--p3i)}.c4{--c:var(--p4);--ci:var(--p4i)}
.c5{--c:var(--p5);--ci:var(--p5i)}.c6{--c:var(--p6);--ci:var(--p6i)}.c7{--c:var(--p7);--ci:var(--p7i)}.c8{--c:var(--p8);--ci:var(--p8i)}
.c0{--c:var(--p0);--ci:var(--p0i)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:38px;height:38px;border-radius:50%;flex:none;background:conic-gradient(var(--p1) 0 49%,var(--p2) 0 91%,var(--p3) 0);box-shadow:inset 0 0 0 8px var(--bg)}
.brand h1{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.1;margin:0;letter-spacing:-.015em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{color:inherit;text-decoration:none;display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px}
.btn:hover{background:var(--sel)}
.btn.primary{background:var(--accent);color:var(--accenti);border-color:transparent}
.btn.primary:hover{opacity:.9;background:var(--accent)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.text{border-color:transparent;background:transparent;color:var(--muted)}
.btn.text:hover{color:var(--ink);background:var(--sel)}

.card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:24px}
.hero{background:var(--surface);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:stretch}
.hero .top2{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-end}
.hero .l{display:flex;flex-direction:column;gap:6px;min-width:0}
.nav{display:flex;align-items:center;gap:6px}
.nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;line-height:1;font-size:16px}
.nav button:hover{background:var(--sel)}
.nav button:disabled{opacity:.35;cursor:default}
.mtitle{font-family:var(--display);font-weight:700;font-size:22px;margin:0 6px;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--tile);color:var(--muted);width:max-content;max-width:100%}
.tabs{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:4px;width:max-content;max-width:100%;box-shadow:var(--shadow)}
.tabs button{border:0;background:transparent;border-radius:999px;padding:8px 18px;font-weight:700;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--accent);color:var(--accenti)}
.cardtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.ctab{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 16px;min-width:120px;text-align:left}
.ctab b{font-size:14px}
.ctab span{font-size:12px;color:var(--muted)}
.ctab:hover{background:var(--sel)}
.ctab.on{background:var(--accent);border-color:transparent;color:var(--accenti)}
.ctab.on span{color:var(--accenti);opacity:.8}
.t .dot{display:inline-block}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cardsel{font:inherit;font-size:12px;font-weight:600;color:var(--ink);background:var(--tile);border:1px solid var(--line);border-radius:999px;padding:3px 8px;max-width:100%}
.btn:disabled{opacity:.5;cursor:default}
.pill.real{background:var(--tile);color:var(--ink)}
.big{font-family:var(--display);font-weight:700;font-size:clamp(42px,7vw,64px);line-height:1;letter-spacing:-.02em;margin-top:10px;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-content:stretch}
.person{background:var(--tile);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.person .n{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-width:0;overflow-wrap:anywhere}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c,var(--p0))}
.person .v{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;overflow-wrap:anywhere}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c)}
.person .s{font-size:12px;color:var(--muted)}
.person .act{display:flex;gap:6px;margin-top:2px}
.person .act button{border:1px solid var(--line);background:transparent;border-radius:999px;font-size:12px;font-weight:600;padding:4px 10px;color:var(--ink)}
.person .act button:hover{background:var(--sel)}
.person.none{background:var(--warnbg);color:var(--warn)}
.manage{align-self:flex-start}

.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ch h2,.lh h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--sel);color:var(--ink)}
.plot{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.col{flex:1 0 54px;display:flex;flex-direction:column;align-items:stretch;gap:6px;border:0;background:transparent;border-radius:14px;padding:6px 4px 8px}
.col:hover{background:var(--soft)}
.col.sel{background:var(--sel)}
.col .tot{font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.col.sel .tot{color:var(--ink)}
.stack{height:210px;display:flex;flex-direction:column-reverse;gap:2px;padding-inline:8px}
.stack i{display:block;border-radius:6px;min-height:2px;background:var(--c)}
.stack i.pr{opacity:.62;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 3px,transparent 3px 7px)}
.col .lbl{font-size:12px;text-align:center;color:var(--muted);font-weight:500}
.col.sel .lbl{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.hatch{width:14px;height:10px;border-radius:3px;background:var(--p0);opacity:.7;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.7) 0 3px,transparent 3px 6px)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:9px 10px;text-align:right;font-size:14px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
th:first-child,td:first-child{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--soft)}
tbody tr.sel{background:var(--sel)}
tfoot td{font-weight:700;border-bottom:0}
td .st{font-size:11px;color:var(--faint);margin-left:6px}

.lh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accenti);border-color:transparent}
.chip b{font-weight:600;opacity:.75;margin-left:4px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--warnbg);color:var(--warn);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:14px;font-weight:500}
.grp{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 16px;align-items:center;padding:12px 0}
.nm{display:flex;flex-direction:column;gap:3px;min-width:0}
.nm .t{display:flex;align-items:center;gap:8px;min-width:0}
.nm .t button{border:0;background:transparent;padding:0;font-weight:600;text-align:left;overflow-wrap:anywhere;font-size:15px}
.nm .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);border:0}
.tag.btnlike{cursor:pointer}
.tag.btnlike:hover{background:var(--sel);color:var(--ink)}
.tag.on{background:var(--sel);color:var(--ink)}
.amt{font-weight:700;text-align:right;white-space:nowrap}
.owners{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:360px}
.o{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.o:hover{background:var(--sel)}
.o.on{border-color:transparent;background:var(--c);color:var(--ci)}
.o.more{border-style:dashed}
.det{padding:0 0 12px 0;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.det div{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:4px 0}
.det .dn{min-width:0;overflow-wrap:anywhere}
.det .da{display:flex;gap:10px;align-items:center;white-space:nowrap}
.det button{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-size:12px;padding:0}
.ign{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}

.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 16px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.hrow .hn{display:flex;flex-direction:column;min-width:0}
.hrow .hn b{font-weight:600}
.hrow .hn span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.hrow.sel .hn b::after{content:" · aberta";color:var(--accent);font-weight:600}
.hnote{margin:0 0 8px;color:var(--muted);font-size:13px}

.start{display:flex;flex-direction:column;gap:20px;align-items:flex-start;padding:30px;background:var(--surface)}
.start h2{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,38px);line-height:1.1;margin:0;letter-spacing:-.02em;max-width:18ch}
.start p{margin:0;color:var(--muted);max-width:52ch}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.step{background:var(--tile);border-radius:16px;padding:14px;font-size:14px}
.step b{display:block;font-family:var(--display);font-size:13px;color:var(--muted);margin-bottom:4px}
.dz{width:100%;border:2px dashed var(--line);border-radius:18px;padding:26px;text-align:center;color:var(--muted)}

#modal:empty{display:none}
.ov{position:fixed;inset:0;background:rgba(5,6,12,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--surface);color:var(--ink);border-radius:24px;padding:24px;width:min(500px,100%);max-height:calc(100% - 8px);overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(30,15,80,.4)}
.dlg h3{font-family:var(--display);font-size:20px;margin:0;letter-spacing:-.01em}
.dlg .kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.dlg .kv span:nth-child(even){font-weight:600;text-align:right}
.dlg label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.dlg input,.dlg select,.dlg textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 10px;width:100%}
.dlg textarea{min-height:220px;resize:vertical}
.dlg .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.pl{display:flex;gap:8px;align-items:center}
.pl input{flex:1;min-width:0}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:500}
#drop{position:fixed;inset:0;z-index:30;background:rgba(10,10,20,.75);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:28px;font-weight:700}
#drop[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accenti);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
#toast:empty{display:none}
.foot-note{text-align:center;color:var(--faint);font-size:12px;margin:0}
.backup{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}

@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .steps{grid-template-columns:minmax(0,1fr)}
  .card{padding:18px;border-radius:20px}
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row .owners{grid-column:1/-1;justify-content:flex-start;max-width:none}
  .hrow{grid-template-columns:minmax(0,1fr) auto}
  .hrow .hb{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){.btn,.col,.o,.chip{transition:background .15s,opacity .15s}}
</style>
</head><body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div><h1 id="ttl">Fatura do Cartão</h1><p id="sttl">Gastos do cartão divididos por pessoa</p></div>
    </div>
    <div class="actions" id="actLoans" hidden>
      <button class="btn primary" data-act="loanform">+ Empréstimo</button>
    </div>
    <div class="actions" id="actFatura">
      <button class="btn" data-act="pessoas">Pessoas</button>
      <button class="btn" id="btnX" data-act="xlsx" hidden>Baixar tudo</button>
      <button class="btn primary" data-act="pick">Importar fatura</button>
      <input type="file" id="file" accept=".csv,text/csv,text/plain" hidden>
    </div>
  </header>
  <nav class="tabs" aria-label="Seções"><button data-act="tab" data-t="fatura" id="tab-fatura">Fatura</button><button data-act="tab" data-t="emprestimos" id="tab-emprestimos">Empréstimos</button></nav>
  <main id="main" class="app" style="gap:16px"></main>
  <p class="foot-note" id="note"></p>
</div>
<div id="modal"></div>
<div id="toast" role="status"></div>
<div id="drop" hidden>Solte o CSV da fatura aqui</div>

<script type="module">window.FATURA_SCRIPT_URL=import.meta.env.VITE_GOOGLE_SCRIPT_URL||"";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";
/* Banco de dados: aba "Lancamentos" da planilha Google, uma linha por compra, no formato
   Data | Descricao | Categoria | Conta | Valor | Quem usou | Cartao | Status | Parcelas | Observacao.
   Parcelas futuras e meses de previsão são calculados a partir dessas linhas. */
var BASE=["Matheus"];
var MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var MS=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
var BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
var N0=new Intl.NumberFormat("pt-BR",{maximumFractionDigits:0});
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var idx=function(y,m){return y*12+m-1};
var pm=function(s){var a=s.split("-");return idx(+a[0],+a[1])};
var mid=function(i){return Math.floor(i/12)+"-"+String(i%12+1).padStart(2,"0")};
var mname=function(i){var n=MESES[i%12];return n.charAt(0).toUpperCase()+n.slice(1)+" de "+Math.floor(i/12)};
var mshort=function(i){return MS[i%12]+"/"+String(Math.floor(i/12)).slice(2)};
var r2=function(x){return Math.round(x*100)/100};
var has=function(o,k){return Object.prototype.hasOwnProperty.call(o,k)};
var pad=function(n){return String(n).padStart(2,"0")};
var todayISO=function(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var nowIdx=function(){var d=new Date();return idx(d.getFullYear(),d.getMonth()+1)};
var LOCAL_KEY="fatura-matheus-v2";

var S={tab:location.hash==="#emprestimos"?"emprestimos":"fatura",rows:[],extra:[],people:BASE.slice(),card:"all",sel:null,filter:"all",view:"chart",open:{},ready:false,mode:"local",pending:null,form:false,pessoas:false,newp:null,text:null,canDl:false,scroll:null,busy:0};
var isP=function(o){return S.people.indexOf(o)>-1};
var cls=function(p){var n=S.people.indexOf(p);return n<0?"c0":"c"+((n%8)+1)};
function groups(t){return S.people.map(function(p){return {n:p,c:cls(p),v:t.by[p]||0}});}
var seq=0;function newId(){return "n"+(++seq)+"_"+Date.now()}

/* ---------- CSV da fatura ---------- */
function parseCSV(text){
  text=text.replace(/^﻿/,"");
  var first=text.split(/\r?\n/)[0]||"";
  var d=first.split(";").length>first.split(",").length?";":",";
  var rows=[],row=[],cur="",q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===d){row.push(cur);cur="";}
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n")i++; row.push(cur);cur=""; if(row.some(function(x){return x.trim()!==""}))rows.push(row); row=[]; }
    else cur+=c;
  }
  if(cur!==""||row.length){row.push(cur); if(row.some(function(x){return x.trim()!==""}))rows.push(row);}
  return rows;
}
function parseAmount(s){
  s=String(s).replace(/R\$/g,"").replace(/\s/g,"");
  var neg=s.indexOf("-")===0; s=s.replace("-","");
  if(s.indexOf(",")>-1) s=s.replace(/\./g,"").replace(",",".");
  var n=parseFloat(s); return isNaN(n)?NaN:(neg?-n:n);
}
function normKey(name){
  return String(name).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s*\*\s*/g,"*").replace(/\s+/g," ").trim();
}
function parseTitle(t){
  var name=t.trim(),cur=null,total=null;
  var m=name.match(/\s*-?\s*(?:Parcela\s+)?(\d{1,2})\/(\d{1,2})\s*$/i);
  if(m && +m[1]<=+m[2] && +m[2]>=2){cur=+m[1];total=+m[2];name=name.slice(0,m.index).trim().replace(/\s*-\s*$/,"");}
  name=name.replace(/^Parcelamento de Compra\s*-\s*/i,"");
  return {name:name,cur:cur,total:total};
}
function buildItems(rows){
  var head=rows[0].map(function(x){return x.trim().toLowerCase()});
  var di=head.findIndex(function(x){return /^(date|data)/.test(x)});
  var ti=head.findIndex(function(x){return /^(title|descri|estabelec|lan)/.test(x)});
  var ai=head.findIndex(function(x){return /^(amount|valor)/.test(x)});
  var ci=head.findIndex(function(x){return /^(category|categ)/.test(x)});
  var body;
  if(di>=0&&ti>=0&&ai>=0) body=rows.slice(1); else {di=0;ti=1;ai=2;ci=-1;body=rows;}
  var items=[];
  body.forEach(function(r){
    if(r.length<=Math.max(di,ti,ai))return;
    var amt=parseAmount(r[ai]); if(isNaN(amt))return;
    var p=parseTitle(r[ti]);
    items.push({date:normDate(r[di]),name:p.name,key:normKey(p.name),amount:r2(amt),cur:p.cur,total:p.total,category:ci>=0?(r[ci]||"").trim():"",ignored:false,reason:""});
  });
  var pool=[];
  items.forEach(function(i){
    if(i.amount<0){i.ignored=true;i.reason="Crédito ou pagamento"; if(/cr[eé]dito|estorno|reembolso/i.test(i.name))pool.push(Math.abs(i.amount).toFixed(2));}
    else if(i.amount===0){i.ignored=true;i.reason="Valor zerado";}
    else if(/pagamento recebido|valor pendente/i.test(i.name)){i.ignored=true;i.reason="Saldo da fatura anterior";}
  });
  items.forEach(function(i){
    if(i.ignored||i.cur)return;
    var k=i.amount.toFixed(2),p=pool.indexOf(k);
    if(p>-1){pool.splice(p,1);i.ignored=true;i.reason="Estornada no mesmo período";}
  });
  return items;
}
function guessMonth(name,items){
  var m=(name||"").match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[1]+"-"+m[2];
  var latest=items.map(function(i){return i.date}).filter(Boolean).sort().pop();
  return latest?latest.slice(0,7):mid(nowIdx());
}

/* ---------- linhas da planilha ---------- */
function normDate(v){
  if(v==null||v==="")return "";
  if(typeof v==="number")return new Date(Math.round((v-25569)*86400000)).toISOString().slice(0,10);
  var s=String(v).trim(),m;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/)))return m[3]+"-"+pad(m[2])+"-"+pad(m[1]);
  var d=new Date(s);
  if(!isNaN(d))return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  return s.slice(0,10);
}
function num(v){if(typeof v==="number")return v;var n=parseAmount(v);return isNaN(n)?0:n;}
function rowFromSheet(a,sheetRow){
  return {id:"r"+sheetRow,sheetRow:sheetRow,date:normDate(a[0]),name:String(a[1]==null?"":a[1]).trim(),category:String(a[2]||"").trim(),account:String(a[3]||"").trim(),amount:r2(num(a[4])),person:String(a[5]||"").trim(),card:String(a[6]||"").trim(),status:String(a[7]||"").trim(),parcelas:Math.max(parseInt(a[8],10)||1,1),notes:String(a[9]||"").trim()};
}
function toArray(r){return [r.date,r.name,r.category,r.account,r.amount,r.person,r.card,r.status,r.parcelas,r.notes];}
function sig(r){return [r.date,r.name,r.amount.toFixed(2),r.person,r.card,r.parcelas,r.notes].join("|");}
function firstMonth(r){
  var m=r.notes.match(/\[primeira-parcela=(\d{4}-\d{2})\]/);
  if(m)return pm(m[1]);
  var d=r.date.match(/^(\d{4})-(\d{2})/);if(!d)return null;
  var i=idx(+d[1],+d[2]);return r.parcelas>1?i+1:i;
}
function instValue(r){var v=Math.abs(r.amount);return /\[valor-total\]/.test(r.notes)&&r.parcelas>1?r2(v/r.parcelas):v;}
function isRec(r){return /\[recorrente\]/.test(r.notes);}
function setMarker(notes,marker,on){notes=notes.split(marker).join("").replace(/\s+/g," ").trim();return on?(notes+" "+marker).trim():notes;}
var CARDS=["Nubank","Itaú","C6","Banco do Brasil"];
function sameCard(a,b){return normKey(a||"")===normKey(b||"");}
function cards(){var c=CARDS.slice();S.rows.forEach(function(r){if(r.amount<0&&r.card&&!c.some(function(x){return sameCard(x,r.card)}))c.push(r.card)});return c;}
function cardName(n){return cards().find(function(c){return sameCard(c,n)})||n;}
function expenses(card){card=card||S.card;return S.rows.filter(function(r){return r.amount<0&&r.name&&(card==="all"||sameCard(r.card,card))&&firstMonth(r)!=null});}

/* ---------- modelo ---------- */
function realMonths(){var s={};expenses().forEach(function(r){if(r.parcelas<=1)s[firstMonth(r)]=1});return s;}
function gidOf(e){return e.key+"|"+(e.total||1)+"|"+(e.total?e.F:"")+"|"+e.kind;}
function entriesFor(i,real){
  if(!real)real=realMonths();
  var isReal=!!real[i],out=[],latestRec={};
  var push=function(r,F,o){out.push({id:r.id,row:r,F:F,name:r.name,key:normKey(r.name),amount:instValue(r),cur:o.cur||null,total:o.total||null,kind:o.kind,owner:r.person,date:r.date,projected:!isReal||!!o.proj});};
  expenses().forEach(function(r){
    var F=firstMonth(r);
    if(r.parcelas>1){var k=i-F+1;if(k>=1&&k<=r.parcelas)push(r,F,{cur:k,total:r.parcelas,kind:"parcelado"});return;}
    if(isRec(r)){
      if(i===F)push(r,F,{kind:"recorrente"});
      else if(i>F&&!isReal){var k2=normKey(r.name);if(!latestRec[k2]||latestRec[k2].F<F)latestRec[k2]={r:r,F:F};}
      return;
    }
    if(i===F)push(r,F,{kind:"avulso"});
  });
  Object.keys(latestRec).forEach(function(k){push(latestRec[k].r,latestRec[k].F,{kind:"recorrente",proj:true})});
  return out;
}
function totals(es){
  var t={by:{},none:0,total:0};
  S.people.forEach(function(p){t.by[p]=0});
  es.forEach(function(e){ if(has(t.by,e.owner))t.by[e.owner]+=e.amount; else t.none+=e.amount; t.total+=e.amount; });
  Object.keys(t.by).forEach(function(k){t.by[k]=r2(t.by[k])});
  t.none=r2(t.none);t.total=r2(t.total);
  return t;
}
function range(){
  var now=nowIdx(),start=now,end=now+3;
  expenses().forEach(function(r){var F=firstMonth(r);start=Math.min(start,F);end=Math.max(end,F+r.parcelas-1);});
  start=Math.max(start,now-24);end=Math.min(end,start+60);
  var a=[];for(var i=start;i<=end;i++)a.push(i);return a;
}
function refreshPeople(){
  var list=BASE.slice(),low=list.map(function(p){return p.toLowerCase()});
  var add=function(p){p=String(p||"").trim();if(p&&low.indexOf(p.toLowerCase())<0){list.push(p);low.push(p.toLowerCase());}};
  S.rows.forEach(function(r){if(r.amount<0)add(r.person)});
  S.extra.forEach(add);
  S.people=list;
}

var scriptUrl="",syncState="local",chain=Promise.resolve();
function saveLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify({rows:S.mode==="local"?S.rows:[],cache:S.mode!=="local"?S.rows:[],extra:S.extra,card:S.card}))}catch(e){}}
function loadLocal(){try{var d=JSON.parse(localStorage.getItem(LOCAL_KEY)||"null");if(d){S.rows=(S.mode==="local"?d.rows:d.cache)||[];S.extra=d.extra||[];S.card=d.card||"all";}}catch(e){}}
function getScriptUrl(){return String(window.FATURA_SCRIPT_URL||"").trim();}
function jsonp(url,params,ms){
  return new Promise(function(resolve,reject){
    var cb="faturaCb"+Date.now()+Math.random().toString(36).slice(2),u=new URL(url),s=document.createElement("script"),t;
    Object.keys(params).forEach(function(k){u.searchParams.set(k,params[k])});
    u.searchParams.set("callback",cb);
    var done=function(){clearTimeout(t);delete window[cb];s.remove();};
    window[cb]=function(data){done();resolve(data)};
    s.onerror=function(){done();reject(new Error("falha"))};
    t=setTimeout(function(){done();reject(new Error("tempo"))},ms||15000);
    s.src=u.toString();document.body.appendChild(s);
  });
}
async function postSheet(payload){
  await fetch(scriptUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:new URLSearchParams({payload:JSON.stringify(payload)})});
}
async function fetchRows(){
  var d=await jsonp(scriptUrl,{action:"listTransactions"});
  if(!d||!Array.isArray(d.values))throw new Error("formato");
  var out=[];
  d.values.forEach(function(a,n){if(n===0||!a||!a.some(function(x){return x!==""&&x!=null}))return;out.push(rowFromSheet(a,n+1));});
  return out;
}
async function reload(){
  if(S.mode!=="sheet"||S.busy)return;
  try{var rows=await fetchRows();if(S.busy)return;S.rows=rows;saveLocal();refreshPeople();render();}catch(e){}
}
/* Troca linhas: apaga as antigas e grava as novas. Usa só as ações que o Apps Script já tem
   (deleteTransaction e appendTransactions). As linhas a apagar são localizadas de novo na
   planilha pelo conteúdo, para não apagar a linha errada se a planilha mudou. */
function commit(remove,add){
  if(S.mode==="offline"){toast("Sem conexão com a planilha agora. Recarregue a página e tente de novo.");return false;}
  var rm={};remove.forEach(function(r){rm[r.id]=1});
  var oldRows=remove.map(function(r){return Object.assign({},r)}),newRows=add.map(toArray);
  S.rows=S.rows.filter(function(r){return !rm[r.id]}).concat(add.map(function(r){r.id=newId();r.sheetRow=null;return r;}));
  refreshPeople();saveLocal();
  if(S.mode!=="sheet")return true;
  S.busy++;note();
  chain=chain.then(async function(){
    if(oldRows.length){
      var fresh=await fetchRows(),used={},targets=[];
      oldRows.forEach(function(r){var s=sig(r),f=fresh.find(function(x){return !used[x.sheetRow]&&sig(x)===s});if(f){used[f.sheetRow]=1;targets.push(f);}});
      targets.sort(function(a,b){return b.sheetRow-a.sheetRow});
      for(var n=0;n<targets.length;n++)await postSheet({action:"deleteTransaction",sheetRow:targets[n].sheetRow,transaction:toArray(targets[n])});
    }
    if(newRows.length)await postSheet({action:"appendTransactions",transactions:newRows});
  }).catch(function(){toast("Não foi possível gravar na planilha. Confira a conexão e tente de novo.");}).then(function(){
    S.busy--;note();if(!S.busy)reload();
  });
  return true;
}
function changeRows(rows,fn){
  var add=rows.map(function(r){var c=Object.assign({},r);fn(c);return c;});
  return commit(rows,add);
}
function afterLoad(){
  S.ready=true;var all=range();
  if(S.sel==null||all.indexOf(S.sel)<0)S.sel=Math.min(Math.max(nowIdx(),all[0]),all[all.length-1]);
  render();
}

  S.canDl=!!window.XLSX; $("#btnX").hidden=!S.canDl;

  try{S.rows=await fetchRows();syncState="sheet";saveLocal();}
  catch(e){S.mode="offline";syncState="offline";}

}

/* ---------- ações ---------- */
function groupRows(gid){
  var seen={},out=[];
  entriesFor(S.sel).forEach(function(e){if(gidOf(e)===gid&&!seen[e.id]){seen[e.id]=1;out.push(e.row)}});
  return out;
}
function setOwner(gid,p){
  var rows=groupRows(gid);if(!rows.length)return;
  var next=rows.every(function(r){return r.person===p})?"":p;
  changeRows(rows.filter(function(r){return r.person!==next}),function(r){r.person=next});
}
function setKind(gid){
  var rows=groupRows(gid).filter(function(r){return r.parcelas<=1});if(!rows.length)return;
  var on=!isRec(rows[0]);
  changeRows(rows,function(r){r.notes=setMarker(r.notes,"[recorrente]",on)});
}
function deleteRow(id){
  var r=S.rows.find(function(x){return x.id===id});if(!r)return;
  if(commit([r],[]))toast("Compra excluída.");
}
function assignAllNone(p){
  var seen={},rows=[];
  entriesFor(S.sel).forEach(function(e){if(!isP(e.owner)&&!seen[e.id]){seen[e.id]=1;rows.push(e.row)}});
  changeRows(rows,function(r){r.person=p});

function cleanName(n){return String(n||"").replace(/\s+/g," ").trim().slice(0,24);}

  n=cleanName(n);if(!n){toast("Escreva um nome.");return null;}
  var found=S.people.find(function(p){return p.toLowerCase()===n.toLowerCase()});
  if(found)return found;

/* ---------- importação ---------- */
function rowSig(r){var F=firstMonth(r);return normKey(r.name)+"|"+instValue(r).toFixed(2)+"|"+r.parcelas+"|"+F+(r.parcelas>1?"":"|"+r.date);}
function lastByKey(){
  var m={};
  S.rows.forEach(function(r){if(r.amount>=0||!r.name)return;var k=normKey(r.name),F=firstMonth(r)||0;if(!m[k]||m[k].F<=F)m[k]={F:F,r:r};});
  return m;
}
function planImport(p,card){
  var month=pm(p.month),have={},last=lastByKey(),add=[],dup=0;
  S.rows.forEach(function(r){if(r.amount<0&&sameCard(r.card,card)){var s=rowSig(r);have[s]=(have[s]||0)+1;}});
  p.items.forEach(function(x){
    if(x.ignored)return;
    var F=x.cur?month-(x.cur-1):month,parc=x.total||1;
    var s=x.key+"|"+x.amount.toFixed(2)+"|"+parc+"|"+F+(parc>1?"":"|"+x.date);
    if(have[s]){have[s]--;dup++;return;}
    var prev=last[x.key],rec=parc<=1&&prev&&prev.r.parcelas<=1&&isRec(prev.r);
    add.push({date:x.date||mid(month)+"-01",name:x.name,category:x.category||(prev&&prev.r.category)||"Sem categoria",account:card,amount:-x.amount,person:prev?prev.r.person:"",card:card,status:"Credito",parcelas:parc,notes:"[valor-parcela] [primeira-parcela="+mid(F)+"]"+(rec?" [recorrente]":"")});
  });
  return {add:add,dup:dup};
}

/* ---------- importar / lançar ---------- */
async function handleFile(file){
  if(!file)return;
  if(S.mode==="offline"){toast("Sem conexão com a planilha agora. Recarregue a página e tente de novo.");return;}
  try{
    var text=await file.text(),rows=parseCSV(text);
    if(rows.length<1)throw new Error("vazio");
    var items=buildItems(rows);
    if(!items.length)throw new Error("sem linhas");
    S.pending={file:file.name,items:items,month:guessMonth(file.name,items),card:S.card==="all"?"Nubank":S.card};
    render();
  }catch(e){toast("Não consegui ler esse arquivo. Use o CSV exportado da fatura do Nubank.");}
}
function confirmImport(){
  var p=S.pending;if(!p)return;
  var plan=planImport(p,p.card);
  S.pending=null;
  if(!plan.add.length){render();return;}
  if(commit([],plan.add)){
    S.sel=pm(p.month);S.filter="all";S.scroll=null;
    if(S.card!=="all"&&S.card!==p.card)S.card=p.card;
    toast(plan.add.length+" compra"+(plan.add.length===1?"":"s")+" gravada"+(plan.add.length===1?"":"s")+" na planilha.");
  }
  render();
}
function addManual(){
  var name=$("#m-name").value.trim(),amt=parseAmount($("#m-amt").value),kind=$("#m-kind").value,own=$("#m-own").value;
  var card=($("#m-card").value||"").trim()||"Nubank",cat=($("#m-cat").value||"").trim()||"Sem categoria";
  var cur=parseInt($("#m-cur").value,10),tot=parseInt($("#m-tot").value,10);
  if(!name||isNaN(amt)||amt<=0){toast("Preencha descrição e valor.");return;}
  if(kind==="parcelado"&&(!(cur>=1)||!(tot>=2)||cur>tot)){toast("Informe a parcela deste mês e o total de parcelas.");return;}
  var F=kind==="parcelado"?S.sel-(cur-1):S.sel;
  var date=S.sel===nowIdx()?todayISO():mid(F)+"-01";
  var row={date:date,name:name,category:cat,account:card,amount:-r2(amt),person:own,card:card,status:"Credito",parcelas:kind==="parcelado"?tot:1,notes:"[valor-parcela] [primeira-parcela="+mid(F)+"]"+(kind==="recorrente"?" [recorrente]":"")};
  if(commit([],[row])){S.form=false;toast("Lançamento gravado.");}
  render();
}

function safe(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"")||"pessoa";}
function personEntries(p){
  return entriesFor(S.sel).filter(function(e){return e.owner===p}).sort(function(a,b){return (a.date||"9999").localeCompare(b.date||"9999")||b.amount-a.amount});
}
function personText(p){
  var es=personEntries(p),g={},order=[],tot=0;
  es.forEach(function(e){var k=gidOf(e);if(!g[k]){g[k]={name:e.name,cur:e.cur,total:e.total,n:0,sum:0};order.push(k);}g[k].n++;g[k].sum+=e.amount;tot+=e.amount;});
  var L=["Fatura do cartão","Referente a "+mname(S.sel)+" — "+p,""];
  order.forEach(function(k){var x=g[k];L.push("• "+x.name+(x.total?" ("+x.cur+"/"+x.total+")":"")+(x.n>1?" ×"+x.n:"")+" — "+BRL.format(r2(x.sum)));});
  L.push("","Total: "+BRL.format(r2(tot)));
  var next=[];
  for(var i=S.sel+1;i<=S.sel+3;i++){var v=totals(entriesFor(i)).by[p];if(v>0)next.push(mshort(i)+" "+BRL.format(v));}
  if(next.length)L.push("","Próximos meses (previsão): "+next.join(" · "));
  return L.join("\n");
}

    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast("Texto copiado. É só colar na conversa.");},show);return;}

}
function exportPerson(p){

function exportXlsx(){
  try{
    if(!window.XLSX){toast("Download indisponível aqui.");return;}
    var all=range(),rm=realMonths(),wb=XLSX.utils.book_new(),np=S.people.length;
    var col=function(n){return XLSX.utils.encode_col(n+1)};

    var w2=XLSX.utils.aoa_to_sheet(B);w2["!cols"]=[{wch:20},{wch:38},{wch:12},{wch:12},{wch:12},{wch:9},{wch:12},{wch:11}];

/* Uma linha por empréstimo que você pegou:
   ID | Data | Descricao | Credor | Valor total | Parcelas | Valor parcela | Primeira parcela | Parcelas pagas | Falta pagar | Meses pagos | Observacao */
var L={list:[],mode:"local",state:"local",sel:null,form:null,busy:0,chain:Promise.resolve(),scroll:null};
var LOAN_KEY="emprestimos-matheus-v1";
function normMonth(v){
  if(v==null||v==="")return "";
  var s=String(v).trim();
  if(/^\d{4}-\d{2}$/.test(s))return s;
  var d=normDate(v);return /^\d{4}-\d{2}/.test(d)?d.slice(0,7):"";
}
function loanFromRow(a){
  var paid=String(a[10]||"").split(/[\s,;]+/).map(normMonth).filter(Boolean);
  return {id:String(a[0]||"").trim(),date:normDate(a[1]),name:String(a[2]||"").trim(),lender:String(a[3]||"").trim(),total:r2(num(a[4])),n:Math.max(parseInt(a[5],10)||1,1),inst:r2(num(a[6])),first:normMonth(a[7]),paid:paid,notes:String(a[11]||"").trim()};
}
function loanPaidCount(l){var F=pm(l.first);return l.paid.filter(function(m){var i=pm(m);return i>=F&&i<F+l.n}).length;}
function loanLeft(l){return r2(l.inst*(l.n-loanPaidCount(l)));}
function loanToRow(l){return [l.id,l.date,l.name,l.lender,l.total,l.n,l.inst,l.first,loanPaidCount(l),loanLeft(l),l.paid.slice().sort().join(" "),l.notes];}
function loanDone(l){return loanPaidCount(l)>=l.n;}
function isPaid(l,i){return l.paid.indexOf(mid(i))>-1;}
function saveLoansLocal(){try{localStorage.setItem(LOAN_KEY,JSON.stringify(L.list))}catch(e){}}
function loadLoansLocal(){try{L.list=JSON.parse(localStorage.getItem(LOAN_KEY)||"[]")||[]}catch(e){L.list=[]}}
async function fetchLoans(){
  var d=await jsonp(scriptUrl,{action:"listEmprestimos"},10000);
  if(!d||!Array.isArray(d.values))throw new Error("formato");
  return d.values.slice(1).filter(function(a){return a&&a[0]}).map(loanFromRow).filter(function(l){return l.first});
}
async function initLoans(){
  loadLoansLocal();
  if(!scriptUrl){L.mode="local";L.state="local";return;}
  L.state="loading";
  try{
    var rows=await fetchLoans();L.mode="sheet";L.state="sheet";
    if(!rows.length&&L.list.length){var pend=L.list.slice();pend.forEach(function(l){queueLoan("save",l)});}
    else{L.list=rows;saveLoansLocal();}
  }catch(e){L.mode="local";L.state="old";}
}
async function reloadLoans(){
  if(L.mode!=="sheet"||L.busy)return;
  try{var rows=await fetchLoans();if(L.busy)return;L.list=rows;saveLoansLocal();if(S.tab==="emprestimos")render();}catch(e){}
}
function queueLoan(kind,l){
  saveLoansLocal();
  if(L.mode!=="sheet")return;
  L.busy++;note();
  var payload=kind==="save"?{action:"saveEmprestimo",row:loanToRow(l)}:{action:"deleteEmprestimo",id:l.id};
  L.chain=L.chain.then(function(){return postSheet(payload)}).catch(function(){toast("Não foi possível gravar na planilha. Confira a conexão e tente de novo.");}).then(function(){L.busy--;note();if(!L.busy)reloadLoans();});
}
function saveLoan(l){
  var i=L.list.findIndex(function(x){return x.id===l.id});
  if(i>-1)L.list[i]=l;else L.list.push(l);
  queueLoan("save",l);
}
function deleteLoan(id){
  var l=L.list.find(function(x){return x.id===id});if(!l)return;
  L.list=L.list.filter(function(x){return x.id!==id});
  queueLoan("delete",l);toast("Empréstimo excluído.");
}
function togglePaid(id,i){
  var l=L.list.find(function(x){return x.id===id});if(!l)return;
  var m=mid(i),c=Object.assign({},l,{paid:l.paid.slice()});
  var k=c.paid.indexOf(m);if(k>-1)c.paid.splice(k,1);else c.paid.push(m);
  saveLoan(c);
}
function loanRange(){
  var now=nowIdx(),start=now,end=now+3;
  L.list.forEach(function(l){var F=pm(l.first);start=Math.min(start,F);end=Math.max(end,F+l.n-1);});
  start=Math.max(start,now-24);end=Math.min(end,start+72);
  var a=[];for(var i=start;i<=end;i++)a.push(i);return a;
}
function loanCls(l){var n=L.list.indexOf(l);return "c"+((n%8)+1);}
function monthLoans(i){return L.list.filter(function(l){var F=pm(l.first);return i>=F&&i<F+l.n});}

function loansHTML(){
  if(!L.list.length)return '<section class="card start"><span class="pill">Nenhum empréstimo ainda</span><h2>Controle os empréstimos que você pegou</h2><p>Cadastre o valor da parcela, quantas são e o mês da primeira. O app mostra quanto falta pagar, as parcelas de cada mês e você marca cada uma como paga. Tudo fica registrado na aba “Emprestimos” da planilha Google.</p><button class="btn primary" data-act="loanform">+ Empréstimo</button></section>';
  var all=loanRange();
  if(L.sel==null||all.indexOf(L.sel)<0)L.sel=Math.min(Math.max(nowIdx(),all[0]),all[all.length-1]);
  var i=L.sel,ms=monthLoans(i),due=0,paidM=0;
  ms.forEach(function(l){due+=l.inst;if(isPaid(l,i))paidM+=l.inst;});
  var left=0,active=0;L.list.forEach(function(l){left+=loanLeft(l);if(!loanDone(l))active++;});
  var hero='<section class="card hero"><div class="top2"><div class="l"><div class="nav"><button data-act="lprev" aria-label="Mês anterior"'+(i<=all[0]?' disabled':'')+'>‹</button><h2 class="mtitle">'+mname(i)+'</h2><button data-act="lnext" aria-label="Próximo mês"'+(i>=all[all.length-1]?' disabled':'')+'>›</button></div><span class="pill">Parcelas do mês</span><div class="big num">'+BRL.format(r2(due))+'</div><div class="sub">'+ms.length+' parcela'+(ms.length===1?'':'s')+' · '+BRL.format(r2(paidM))+' já pago</div></div></div><div class="people">'
    +'<div class="person c2"><div class="n"><span class="dot"></span>Falta pagar</div><div class="v num">'+BRL.format(r2(left))+'</div><div class="s">somando todos os empréstimos</div></div>'
    +'<div class="person c3"><div class="n"><span class="dot"></span>Pago neste mês</div><div class="v num">'+BRL.format(r2(paidM))+'</div><div class="bar"><i style="width:'+(due?Math.round(paidM/due*100):0)+'%"></i></div><div class="s num">de '+BRL.format(r2(due))+'</div></div>'
    +'<div class="person c1"><div class="n"><span class="dot"></span>Ativos</div><div class="v num">'+active+'</div><div class="s">'+(L.list.length-active)+' quitado'+(L.list.length-active===1?'':'s')+'</div></div>'
    +'</div></section>';
  var data=all.map(function(m){var segs=monthLoans(m).map(function(l){return {l:l,v:l.inst,paid:isPaid(l,m)}});return {i:m,segs:segs,t:segs.reduce(function(a,s){return a+s.v},0)};});
  var mx=Math.max.apply(null,data.map(function(d){return d.t}).concat([1]));
  var chart='<section class="card"><div class="ch"><h2>Parcelas mês a mês</h2></div><div class="plot" id="lplot">'+data.map(function(d){
    var segs=d.segs.map(function(s){return '<i class="'+loanCls(s.l)+(s.paid?'':' pr')+'" style="height:'+Math.max(2,s.v/mx*200)+'px" title="'+esc(s.l.name)+': '+BRL.format(s.v)+(s.paid?' (paga)':' (em aberto)')+'"></i>'}).join("");
    return '<button class="col'+(d.i===i?' sel':'')+'" data-act="lsel" data-i="'+d.i+'" aria-label="'+mname(d.i)+', '+BRL.format(d.t)+'"><span class="tot num">'+(d.t?N0.format(d.t):'–')+'</span><div class="stack">'+segs+'</div><span class="lbl">'+mshort(d.i)+'</span></button>';
  }).join("")+'</div><div class="legend">'+L.list.map(function(l){return '<span class="'+loanCls(l)+'"><i class="dot"></i>'+esc(l.name)+'</span>'}).join("")+'<span><i class="hatch"></i>Listrado = em aberto</span></div></section>';
  var sorted=L.list.slice().sort(function(a,b){return (loanDone(a)-loanDone(b))||pm(a.first)-pm(b.first)});
  var rows=sorted.map(function(l){
    var F=pm(l.first),k=i-F+1,pc=loanPaidCount(l),inMonth=k>=1&&k<=l.n,paid=inMonth&&isPaid(l,i);
    var next=null;for(var j=F;j<F+l.n;j++){if(!isPaid(l,j)){next=j;break;}}
    var meta='<span class="tag">'+pc+' de '+l.n+' pagas</span>'+(l.lender?'<span class="tag">'+esc(l.lender)+'</span>':'')+(loanDone(l)?'<span class="tag on">quitado</span>':(next!=null?'<span class="tag">próxima: '+mshort(next)+'</span>':''))+'<span class="tag">até '+mshort(F+l.n-1)+'</span>';
    var pay=inMonth?'<button class="o '+loanCls(l)+(paid?' on':'')+'" data-act="lpay" data-id="'+esc(l.id)+'" aria-pressed="'+paid+'">'+(paid?'Paga ✓':'Pagar '+k+'/'+l.n)+'</button>':'<span class="tag">sem parcela em '+mshort(i)+'</span>';
    var open=S.open["L"+l.id];
    var det=open?'<div class="det"><div><span class="dn">Valor pego</span><span class="da num">'+(l.total?BRL.format(l.total):'–')+'</span></div><div><span class="dn">Total das parcelas</span><span class="da num">'+BRL.format(r2(l.inst*l.n))+(l.total&&l.inst*l.n>l.total?' · juros '+BRL.format(r2(l.inst*l.n-l.total)):'')+'</span></div><div><span class="dn">Falta pagar</span><span class="da num">'+BRL.format(loanLeft(l))+'</span></div>'+(l.date?'<div><span class="dn">Data</span><span class="da">'+esc(l.date.split("-").reverse().join("/"))+'</span></div>':'')+(l.notes?'<div><span class="dn">'+esc(l.notes)+'</span></div>':'')+'<div><span class="dn"></span><span class="da"><button data-act="ledit" data-id="'+esc(l.id)+'">editar</button><button data-act="ldel" data-id="'+esc(l.id)+'">excluir</button></span></div></div>':'';
    return '<div class="grp"><div class="row"><div class="nm"><div class="t"><span class="dot '+loanCls(l)+'"></span><button data-act="open" data-g="L'+esc(l.id)+'" aria-expanded="'+!!open+'">'+esc(l.name)+'</button></div><div class="m">'+meta+'</div><div class="bar '+loanCls(l)+'" style="max-width:260px"><i style="width:'+Math.round(pc/l.n*100)+'%"></i></div></div><div class="amt num">'+BRL.format(l.inst)+'<div class="sub">por mês</div></div><span class="owners">'+pay+'</span></div>'+det+'</div>';
  }).join("");
  var list='<section class="card"><div class="lh"><h2>Empréstimos</h2><button class="btn sm" data-act="loanform">+ Empréstimo</button></div><div>'+rows+'</div></section>';
  return hero+chart+list;
}
function loanFormHTML(){
  var l=L.form.loan||{},edit=!!L.form.loan;
  var first=l.first||mid(L.sel!=null?L.sel:nowIdx());
  var fy=+first.slice(0,4),fm=+first.slice(5,7),ys="";for(var a=fy-5;a<=fy+3;a++)ys+='<option value="'+a+'"'+(a===fy?' selected':'')+'>'+a+'</option>';
  var mos=MESES.map(function(n,j){return '<option value="'+(j+1)+'"'+(j+1===fm?' selected':'')+'>'+n.charAt(0).toUpperCase()+n.slice(1)+'</option>'}).join("");
  var fmt=function(v){return v?String(v).replace(".",","):""};
  return '<div class="ov"><form class="dlg" id="loanf" role="dialog" aria-modal="true" aria-label="Empréstimo"><h3>'+(edit?'Editar empréstimo':'Novo empréstimo')+'</h3><label>Descrição<input id="l-name" required value="'+esc(l.name||"")+'" placeholder="Ex.: Empréstimo Nubank, Consignado"></label><div class="two"><label>De quem peguei<input id="l-lender" value="'+esc(l.lender||"")+'" placeholder="Banco ou pessoa"></label><label>Data<input id="l-date" type="date" value="'+esc(l.date||todayISO())+'"></label></div><div class="two"><label>Valor pego (R$)<input id="l-total" inputmode="decimal" value="'+fmt(l.total)+'" placeholder="Opcional"></label><label>Valor da parcela (R$)<input id="l-inst" required inputmode="decimal" value="'+fmt(l.inst)+'" placeholder="0,00"></label></div><div class="two"><label>Número de parcelas<input id="l-n" required inputmode="numeric" value="'+(l.n||"")+'" placeholder="12"></label><label>Já paguei (parcelas)<input id="l-paid" inputmode="numeric" value="'+(edit?loanPaidCount(l):"")+'" placeholder="0"></label></div><div class="two"><label>Primeira parcela<select id="l-fm">'+mos+'</select></label><label>Ano<select id="l-fy">'+ys+'</select></label></div><label>Observação<input id="l-notes" value="'+esc(l.notes||"")+'" placeholder="Opcional"></label><div class="foot"><button type="button" class="btn" data-act="cancel">Cancelar</button><button class="btn primary" type="submit">Gravar</button></div></form></div>';
}
function submitLoan(){
  var name=$("#l-name").value.trim(),inst=parseAmount($("#l-inst").value),n=parseInt($("#l-n").value,10);
  var total=$("#l-total").value.trim()?parseAmount($("#l-total").value):0,paidN=parseInt($("#l-paid").value,10)||0;
  if(!name||isNaN(inst)||inst<=0||!(n>=1)){toast("Preencha descrição, valor da parcela e número de parcelas.");return;}
  if(isNaN(total)||total<0)total=0;
  paidN=Math.max(0,Math.min(paidN,n));
  var first=$("#l-fy").value+"-"+pad($("#l-fm").value),F=pm(first),old=L.form.loan;
  var paid;
  if(old&&old.first===first&&loanPaidCount(old)===paidN)paid=old.paid.filter(function(m){var i=pm(m);return i>=F&&i<F+n});
  else{paid=[];for(var k=0;k<paidN;k++)paid.push(mid(F+k));}
  var l={id:old?old.id:"E"+Date.now().toString(36),date:$("#l-date").value||todayISO(),name:name,lender:$("#l-lender").value.trim(),total:r2(total),n:n,inst:r2(inst),first:first,paid:paid,notes:$("#l-notes").value.trim()};
  saveLoan(l);L.form=null;L.sel=null;toast(old?"Empréstimo atualizado.":"Empréstimo gravado.");render();
}

/* ---------- eventos ---------- */
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");
  if(!el){ if(ev.target.classList&&ev.target.classList.contains("ov")){closeAll();render();} return; }
  var a=el.getAttribute("data-act"),d=el.dataset;
  if(a==="tab"){S.tab=d.t;try{history.replaceState(null,"",d.t==="emprestimos"?"#emprestimos":location.pathname)}catch(e){}render();window.scrollTo&&window.scrollTo({top:0});return;}
  if(a==="card"){S.card=d.c;S.filter="all";S.scroll=null;saveLocal();var ra=range();if(ra.indexOf(S.sel)<0)S.sel=Math.min(Math.max(nowIdx(),ra[0]),ra[ra.length-1]);render();return;}
  if(a==="loanform"){L.form={loan:null};render();var ln=$("#l-name");if(ln)ln.focus();return;}
  if(a==="ledit"){L.form={loan:L.list.find(function(x){return x.id===d.id})||null};render();return;}
  if(a==="ldel"){if(el.dataset.sure){deleteLoan(d.id);render();return;}el.dataset.sure="1";el.textContent="confirmar exclusão";return;}
  if(a==="lpay"){togglePaid(d.id,L.sel);render();return;}
  if(a==="lprev"||a==="lnext"){var la=loanRange(),ln2=L.sel+(a==="lnext"?1:-1);if(ln2>=la[0]&&ln2<=la[la.length-1]){L.sel=ln2;L.scroll=null;render();}return;}
  if(a==="lsel"){L.sel=+d.i;render();return;}
  if(a==="pick"){$("#file").click();return;}
  if(a==="xlsx"){exportXlsx();return;}
  if(a==="pxlsx"){exportPerson(d.p);return;}
  if(a==="pcopy"){copyPerson(d.p);return;}
  if(a==="copytxt"){var t=$("#txt");if(t){t.select();try{navigator.clipboard.writeText(t.value).then(function(){toast("Texto copiado.")},function(){toast("Selecione o texto e copie.")});}catch(e){toast("Selecione o texto e copie.");}}return;}
  if(a==="prev"||a==="next"){var all=range(),n=S.sel+(a==="next"?1:-1);if(n>=all[0]&&n<=all[all.length-1]){S.sel=n;S.filter="all";S.scroll=null;render();}return;}
  if(a==="sel"){S.sel=+d.i;S.filter="all";render();window.scrollTo&&window.scrollTo({top:0,behavior:"smooth"});return;}
  if(a==="view"){S.view=d.v;render();return;}
  if(a==="filter"){S.filter=d.f;render();return;}
  if(a==="owner"){setOwner(d.g,d.p);render();return;}
  if(a==="newp"){S.newp={g:d.g};render();var inp=$("#np-name");if(inp)inp.focus();return;}
  if(a==="kind"){setKind(d.g);render();return;}
  if(a==="allnone"){assignAllNone(d.p);render();return;}
  if(a==="open"){S.open[d.g]=!S.open[d.g];render();return;}
  if(a==="del"){
    if(el.dataset.sure){deleteRow(d.id);render();return;}
    el.dataset.sure="1";el.textContent="confirmar exclusão";return;
  }
  if(a==="addform"){S.form=true;render();var mn=$("#m-name");if(mn)mn.focus();return;}
  if(a==="pessoas"){S.pessoas=true;render();return;}
  if(a==="remp"){removePerson(d.p);render();return;}
  if(a==="cancel"){closeAll();render();return;}
  if(a==="confirm"){confirmImport();return;}
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.id==="file"){handleFile(t.files[0]);t.value="";return;}
  if(S.pending&&(t.id==="imp-m"||t.id==="imp-y"||t.id==="imp-card")){
    S.pending.month=$("#imp-y").value+"-"+pad($("#imp-m").value);
    S.pending.card=($("#imp-card").value||"").trim()||"Nubank";
    render();return;
  }
  if(t.id==="m-kind"){$("#m-par").hidden=t.value!=="parcelado";}
});
document.addEventListener("submit",function(ev){
  var id=ev.target.id;
  if(id==="loanf"){ev.preventDefault();submitLoan();}
  else if(id==="addf"){ev.preventDefault();addManual();}
  else if(id==="newpf"){ev.preventDefault();var n=addPerson($("#np-name").value);if(n&&S.newp){var g=S.newp.g;S.newp=null;var rows=groupRows(g);if(!rows.every(function(r){return r.person===n}))setOwner(g,n);render();}}
  else if(id==="addpf"){ev.preventDefault();var n2=addPerson($("#ap-name").value);if(n2){render();var i2=$("#ap-name");if(i2)i2.focus();}}
});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&(L.form||S.pending||S.form||S.pessoas||S.newp||S.text)){closeAll();render();}});
var dc=0;
window.addEventListener("dragenter",function(e){if(e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],"Files")>-1){dc++;$("#drop").hidden=false;}});
window.addEventListener("dragleave",function(){dc=Math.max(0,dc-1);if(!dc)$("#drop").hidden=true;});
window.addEventListener("dragover",function(e){e.preventDefault();});
window.addEventListener("drop",function(e){e.preventDefault();dc=0;$("#drop").hidden=true;var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)handleFile(f);});

document.addEventListener("DOMContentLoaded",init);
})();
</script>

</body></html>

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11121A">
<title>Fatura do Cartão</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23F06BAA%22/%3E%3Cpath d=%22M16 2a14 14 0 0 1 12 21L16 16z%22 fill=%22%23F2BE4A%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabeçalho, resumo do mês em lavanda com um cartão por pessoa, gráfico dos meses, lançamentos agrupados e histórico das faturas. */
:root{
  color-scheme:dark;
  --bg:#11121A; --surface:#1B1C27; --ink:#F2F2F7; --muted:#A3A4B5; --faint:#6E7083;
  --line:#2C2E3C; --sel:#272938; --soft:#22232F; --accent:#F06BAA; --accenti:#1A0710;
  --hero1:#1B1C27; --hero2:#1B1C27; --tile:#232431;
  --p1:#F06BAA; --p1i:#1A0710; --p2:#F2BE4A; --p2i:#2B1D00; --p3:#3FD0BF; --p3i:#04292C; --p4:#9C8CFF; --p4i:#14103A;
  --p5:#7FB0F5; --p5i:#0B1D3A; --p6:#6FCB91; --p6i:#0B2A17; --p7:#F28A76; --p7i:#3A0F07; --p8:#C9B6E8; --p8i:#231A3A;
  --p0:#5A5C6E; --p0i:#F2F2F7; --warn:#F2BE4A; --warnbg:#2A2416;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.3);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:20px 56px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
#main{width:100%;min-width:0}
.num{font-variant-numeric:tabular-nums}
.c1{--c:var(--p1);--ci:var(--p1i)}.c2{--c:var(--p2);--ci:var(--p2i)}.c3{--c:var(--p3);--ci:var(--p3i)}.c4{--c:var(--p4);--ci:var(--p4i)}
.c5{--c:var(--p5);--ci:var(--p5i)}.c6{--c:var(--p6);--ci:var(--p6i)}.c7{--c:var(--p7);--ci:var(--p7i)}.c8{--c:var(--p8);--ci:var(--p8i)}
.c0{--c:var(--p0);--ci:var(--p0i)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:38px;height:38px;border-radius:50%;flex:none;background:conic-gradient(var(--p1) 0 49%,var(--p2) 0 91%,var(--p3) 0);box-shadow:inset 0 0 0 8px var(--bg)}
.brand h1{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.1;margin:0;letter-spacing:-.015em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{color:inherit;text-decoration:none;display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px}
.btn:hover{background:var(--sel)}
.btn.primary{background:var(--accent);color:var(--accenti);border-color:transparent}
.btn.primary:hover{opacity:.9;background:var(--accent)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.text{border-color:transparent;background:transparent;color:var(--muted)}
.btn.text:hover{color:var(--ink);background:var(--sel)}

.card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:24px}
.hero{background:var(--surface);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:stretch}
.hero .top2{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-end}
.hero .l{display:flex;flex-direction:column;gap:6px;min-width:0}
.nav{display:flex;align-items:center;gap:6px}
.nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;line-height:1;font-size:16px}
.nav button:hover{background:var(--sel)}
.nav button:disabled{opacity:.35;cursor:default}
.mtitle{font-family:var(--display);font-weight:700;font-size:22px;margin:0 6px;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--tile);color:var(--muted);width:max-content;max-width:100%}
.tabs{overflow-x:auto;scrollbar-width:none;background:var(--surface);border-radius:999px;padding:4px;width:max-content;max-width:100%;box-shadow:var(--shadow)}
.tabs button{flex:none;border:0;background:transparent;border-radius:999px;padding:8px 18px;font-weight:700;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--accent);color:var(--accenti)}
.cardtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.ctab{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 16px;min-width:120px;text-align:left}
.ctab b{font-size:14px}
.ctab span{font-size:12px;color:var(--muted)}
.ctab:hover{background:var(--sel)}
.ctab.on{background:var(--accent);border-color:transparent;color:var(--accenti)}
.ctab.on span{color:var(--accenti);opacity:.8}
.t .dot{display:inline-block}
:root{--inc:#4FD1A5;--exp:#F06BAA}
.cinc{--c:var(--inc);--ci:#04291F}.cexp{--c:var(--exp);--ci:#1A0710}
.inc-t{color:var(--inc)}.exp-t{color:var(--exp)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px}
.pair{height:210px;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.pair i{display:block;width:16px;border-radius:6px 6px 2px 2px;background:var(--c)}
.pair i.pr,.stack i.pr{opacity:.62;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 3px,transparent 3px 7px)}
.hbars{display:flex;flex-direction:column;gap:2px}
.hb-row{display:grid;grid-template-columns:minmax(0,140px) minmax(40px,1fr) auto;gap:12px;align-items:center;padding:7px 0;font-size:14px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.hb-track i{display:block;height:100%;border-radius:99px;background:var(--c)}
.hb-v{font-weight:700;white-space:nowrap}.hb-v small{color:var(--muted);font-weight:600;margin-left:4px}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{width:170px;height:170px;flex:none}
.dt1{font-size:9px;fill:var(--muted);font-family:var(--body)}.dt2{font-size:15px;font-weight:700;fill:var(--ink);font-family:var(--display)}
.dleg{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px;font-size:14px}
.dleg div{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center}
.dleg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dleg small{color:var(--muted);min-width:34px;text-align:right}
.lwrap{overflow-x:auto}
.lchart{width:100%;min-width:640px;height:200px;display:block}
.lchart .zero{stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.lchart .ln{fill:none;stroke:var(--inc);stroke-width:2.5;vector-effect:non-scaling-stroke}
.lchart .area{fill:var(--inc);opacity:.12}
.lchart .pp{fill:var(--inc)}.lchart .pn{fill:var(--exp)}
.lchart .lx{font-size:11px;fill:var(--muted);font-family:var(--body)}
.toplist{display:flex;flex-direction:column}
.toplist div{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.toplist .rk{width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.toplist .dn{display:flex;flex-direction:column;min-width:0}.toplist .dn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.toplist small{color:var(--muted);font-size:12px}
.avgbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border-radius:16px;padding:12px 16px;font-size:14px;color:var(--muted)}
.avgbox input{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 10px;width:120px}
.hsec+.hsec{margin-top:14px}
.hsec-h{display:flex;align-items:center;gap:8px;padding:6px 0 8px;font-size:14px}
.hsec-h .num{margin-left:auto;font-weight:700;color:var(--c)}
.empty.sm{padding:12px 0;text-align:left;font-size:13px;border-top:1px solid var(--line)}
.tag.late{background:rgba(240,107,170,.18);color:var(--exp)}
.paidbox{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill.part{background:rgba(242,190,74,.16);color:var(--p2)}
.pill.paid{background:rgba(79,209,165,.16);color:var(--inc)}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cardsel{font:inherit;font-size:12px;font-weight:600;color:var(--ink);background:var(--tile);border:1px solid var(--line);border-radius:999px;padding:3px 8px;max-width:100%}
.btn:disabled{opacity:.5;cursor:default}
.pill.real{background:var(--tile);color:var(--ink)}
.big{font-family:var(--display);font-weight:700;font-size:clamp(42px,7vw,64px);line-height:1;letter-spacing:-.02em;margin-top:10px;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-content:stretch}
.person{background:var(--tile);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.person .n{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-width:0;overflow-wrap:anywhere}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c,var(--p0))}
.person .v{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;overflow-wrap:anywhere}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c)}
.person .s{font-size:12px;color:var(--muted)}
.person .act{display:flex;gap:6px;margin-top:2px}
.person .act button{border:1px solid var(--line);background:transparent;border-radius:999px;font-size:12px;font-weight:600;padding:4px 10px;color:var(--ink)}
.person .act button:hover{background:var(--sel)}
.person.none{background:var(--warnbg);color:var(--warn)}
.manage{align-self:flex-start}

.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ch h2,.lh h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--sel);color:var(--ink)}
.plot{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.col{flex:1 0 54px;display:flex;flex-direction:column;align-items:stretch;gap:6px;border:0;background:transparent;border-radius:14px;padding:6px 4px 8px}
.col:hover{background:var(--soft)}
.col.sel{background:var(--sel)}
.col .tot{font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.col.sel .tot{color:var(--ink)}
.stack{height:210px;display:flex;flex-direction:column-reverse;gap:2px;padding-inline:8px}
.stack i{display:block;border-radius:6px;min-height:2px;background:var(--c)}
.stack i.pr{opacity:.62;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 3px,transparent 3px 7px)}
.col .lbl{font-size:12px;text-align:center;color:var(--muted);font-weight:500}
.col.sel .lbl{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.hatch{width:14px;height:10px;border-radius:3px;background:var(--p0);opacity:.7;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.7) 0 3px,transparent 3px 6px)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:9px 10px;text-align:right;font-size:14px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
th:first-child,td:first-child{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--soft)}
tbody tr.sel{background:var(--sel)}
tfoot td{font-weight:700;border-bottom:0}
td .st{font-size:11px;color:var(--faint);margin-left:6px}

.lh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accenti);border-color:transparent}
.chip b{font-weight:600;opacity:.75;margin-left:4px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--warnbg);color:var(--warn);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:14px;font-weight:500}
.grp{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 16px;align-items:center;padding:12px 0}
.nm{display:flex;flex-direction:column;gap:3px;min-width:0}
.nm .t{display:flex;align-items:center;gap:8px;min-width:0}
.nm .t button{border:0;background:transparent;padding:0;font-weight:600;text-align:left;overflow-wrap:anywhere;font-size:15px}
.nm .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);border:0}
.tag.btnlike{cursor:pointer}
.tag.btnlike:hover{background:var(--sel);color:var(--ink)}
.tag.on{background:var(--sel);color:var(--ink)}
.amt{font-weight:700;text-align:right;white-space:nowrap}
.owners{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:360px}
.o{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.o:hover{background:var(--sel)}
.o.on{border-color:transparent;background:var(--c);color:var(--ci)}
.o.more{border-style:dashed}
.det{padding:0 0 12px 0;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.det div{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:4px 0}
.det .dn{min-width:0;overflow-wrap:anywhere}
.det .da{display:flex;gap:10px;align-items:center;white-space:nowrap}
.det button{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-size:12px;padding:0}
.ign{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}

.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 16px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.hrow .hn{display:flex;flex-direction:column;min-width:0}
.hrow .hn b{font-weight:600}
.hrow .hn span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.hrow.sel .hn b::after{content:" · aberta";color:var(--accent);font-weight:600}
.hnote{margin:0 0 8px;color:var(--muted);font-size:13px}

.start{display:flex;flex-direction:column;gap:20px;align-items:flex-start;padding:30px;background:var(--surface)}
.start h2{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,38px);line-height:1.1;margin:0;letter-spacing:-.02em;max-width:18ch}
.start p{margin:0;color:var(--muted);max-width:52ch}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.step{background:var(--tile);border-radius:16px;padding:14px;font-size:14px}
.step b{display:block;font-family:var(--display);font-size:13px;color:var(--muted);margin-bottom:4px}
.dz{width:100%;border:2px dashed var(--line);border-radius:18px;padding:26px;text-align:center;color:var(--muted)}

#modal:empty{display:none}
.ov{position:fixed;inset:0;background:rgba(5,6,12,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--surface);color:var(--ink);border-radius:24px;padding:24px;width:min(500px,100%);max-height:calc(100% - 8px);overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(30,15,80,.4)}
.dlg h3{font-family:var(--display);font-size:20px;margin:0;letter-spacing:-.01em}
.dlg .kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.dlg .kv span:nth-child(even){font-weight:600;text-align:right}
.dlg label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.dlg input,.dlg select,.dlg textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 10px;width:100%}
.dlg textarea{min-height:220px;resize:vertical}
.dlg .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.pl{display:flex;gap:8px;align-items:center}
.pl input{flex:1;min-width:0}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:500}
#drop{position:fixed;inset:0;z-index:30;background:rgba(10,10,20,.75);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:28px;font-weight:700}
#drop[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accenti);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
#toast:empty{display:none}
.foot-note{text-align:center;color:var(--faint);font-size:12px;margin:0}
.backup{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}

@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .steps{grid-template-columns:minmax(0,1fr)}
  .card{padding:18px;border-radius:20px}
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row .owners{grid-column:1/-1;justify-content:flex-start;max-width:none}
  .hrow{grid-template-columns:minmax(0,1fr) auto}
  .hrow .hb{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){.btn,.col,.o,.chip{transition:background .15s,opacity .15s}}
</style>
</head><body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div><h1 id="ttl">Fatura do Cartão</h1><p id="sttl">Gastos do cartão divididos por pessoa</p></div>
    </div>
    <div class="actions" id="actCasa" hidden>
      <button class="btn primary" data-act="hform">+ Conta da casa</button>
    </div>
    <div class="actions" id="actInc" hidden>
      <button class="btn primary" data-act="incform">+ Recebimento</button>
    </div>
    <div class="actions" id="actLoans" hidden>
      <button class="btn primary" data-act="loanform">+ Empréstimo</button>
    </div>
    <div class="actions" id="actFatura">
      <button class="btn" data-act="pessoas">Pessoas</button>

var MON={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
function rowsFromLines(lines){
  var DATE=/(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?|\d{1,2}\s(?:jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-zç]*\.?)/.source;

/* Troca linhas: apaga as antigas e grava as novas. Usa só as ações que o Apps Script já tem
   (deleteTransaction e appendTransactions). As linhas a apagar são localizadas de novo na
   planilha pelo conteúdo, para não apagar a linha errada se a planilha mudou. */
var retryTimer=null;
async function fetchRowsRetry(tries){
  for(var n=0;n<tries;n++){
    try{return await fetchRows();}catch(e){if(n===tries-1)throw e;await new Promise(function(r){setTimeout(r,3000*(n+1))});}
  }
}
function goOnline(rows){
  S.mode="sheet";syncState="sheet";clearTimeout(retryTimer);
  if(rows&&!S.busy){S.rows=rows;saveLocal();refreshPeople();}
  note();
}
/* Sem conexão: tenta de novo sozinho a cada 20 s, sem precisar recarregar a página. */
function scheduleRetry(){
  clearTimeout(retryTimer);
  retryTimer=setTimeout(async function(){
    if(S.mode!=="offline")return;
    try{var rows=await fetchRows();goOnline(rows);afterLoad();toast("Planilha conectada de novo.");}catch(e){scheduleRetry();}
  },20000);
}
async function ensureOnline(){
  if(S.mode==="sheet")return;

  catch(e){S.mode="offline";syncState="offline";note();scheduleRetry();throw e;}
}
function commit(remove,add){
  var rm={};remove.forEach(function(r){rm[r.id]=1});
  var oldRows=remove.map(function(r){return Object.assign({},r)}),newRows=add.map(toArray);
  S.rows=S.rows.filter(function(r){return !rm[r.id]}).concat(add.map(function(r){r.id=newId();r.sheetRow=null;return r;}));
  refreshPeople();saveLocal();
  if(S.mode==="local")return true;
  S.busy++;note();
  chain=chain.then(async function(){
    await ensureOnline();
    if(oldRows.length){
      var fresh=await fetchRows(),used={},targets=[];
      oldRows.forEach(function(r){var s=sig(r),f=fresh.find(function(x){return !used[x.sheetRow]&&sig(x)===s});if(f){used[f.sheetRow]=1;targets.push(f);}});
      targets.sort(function(a,b){return b.sheetRow-a.sheetRow});
      for(var n=0;n<targets.length;n++)await postSheet({action:"deleteTransaction",sheetRow:targets[n].sheetRow,transaction:toArray(targets[n])});
    }
    if(newRows.length)await postSheet({action:"appendTransactions",transactions:newRows});
  }).catch(function(){toast("Não consegui gravar na planilha agora. Essa alteração não foi salva; tente de novo em instantes.");}).then(function(){

}

function planImport(p,card){

  S.rows.forEach(function(r){if(r.amount<0&&sameCard(r.card,card)){var s=rowSig(r);have[s]=(have[s]||0)+1;}});

/* ---------- importar / lançar ---------- */
/* Aceita um arquivo ou vários (ex.: várias fotos da mesma fatura); tudo vira uma importação só. */
async function handleFile(file,password){
  var files=file&&file.length!=null&&!file.name?Array.prototype.slice.call(file):(file?[file]:[]);
  if(!files.length)return;
  file=files[0];
  toast("Lendo o arquivo…");
  try{
    var parts=[];
    for(var fi=0;fi<files.length;fi++){
      var f=files[fi];
      parts=parts.concat(extOf(f.name)==="zip"?await unzipAll(f,password):[{name:f.name,buf:new Uint8Array(await f.arrayBuffer())}]);
    }
    if(files.length>1)file={name:files.length+" arquivos"};
    var items=[],due=null;
    for(var n=0;n<parts.length;n++){var got=await itemsFromBuffer(parts[n].name,parts[n].buf,password);if(got.due)due=got.due;items=items.concat(got);}
    if(!items.length)throw {msg:"Não encontrei compras nesse arquivo. Confira se é a fatura do cartão."};
    var names=parts.map(function(x){return x.name}).join(", "),all=names+" "+file.name;
    S.askPass=null;
    S.pending={file:names===file.name?file.name:file.name+" → "+names,items:items,month:due||guessMonth(all,items),card:guessCard(all)};
    if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(S.pending.month))S.pending.month=mid(nowIdx());
    toast("");render();
  }catch(e){
    if(e&&e.code==="password"){toast("");S.askPass={file:files.length>1?files:files[0],name:file.name,wrong:!!e.wrong};render();var pi=$("#pw");if(pi)pi.focus();return;}
    toast(e&&e.msg||"Não consegui ler esse arquivo. Use CSV, OFX, Excel, PDF, imagem ou ZIP da fatura.");
  }
}

  var p=S.pending;if(!p)return;

}

  var name=$("#m-name").value.trim(),amt=parseAmount($("#m-amt").value),kind=$("#m-kind").value,own=$("#m-own").value;

  var cur=parseInt($("#m-cur").value,10),tot=parseInt($("#m-tot").value,10);
  if(!name||isNaN(amt)||amt<=0){toast("Preencha descrição e valor.");return;}
  if(kind==="parcelado"&&(!(cur>=1)||!(tot>=2)||cur>tot)){toast("Informe a parcela deste mês e o total de parcelas.");return;}

var L={list:[],mode:"local",state:"local",sel:null,form:null,busy:0,chain:Promise.resolve(),scroll:null};

function normMonth(v){

function loanPaidCount(l){var F=pm(l.first);return l.paid.filter(function(m){var i=pm(m);return i>=F&&i<F+l.n}).length;}
function loanLeft(l){return r2(l.inst*(l.n-loanPaidCount(l)));}
function loanToRow(l){return [l.id,l.date,l.name,l.lender,l.total,l.n,l.inst,l.first,loanPaidCount(l),loanLeft(l),l.paid.slice().sort().join(" "),l.notes];}

function incomeFor(i){
  var out=[],rec={};
  incomes().forEach(function(r){
    var F=firstMonth(r),e={id:r.id,row:r,name:r.name,key:normKey(r.name),amount:r2(r.amount),category:r.category||"Outros",person:r.person||BASE[0],account:r.account,date:r.date,rec:isRec(r),projected:false};
    if(F===i)out.push(e);
    else if(e.rec&&F<i&&(!rec[e.key]||rec[e.key].F<F))rec[e.key]={e:e,F:F};
  });
  Object.keys(rec).forEach(function(k){
    if(out.some(function(x){return x.key===k}))return;
    var e=Object.assign({},rec[k].e,{projected:true});out.push(e);
  });
  return out;
}

/* ---------- casa: aluguel e contas que não são do cartão ---------- */
/* Na aba Lancamentos, sem cartão e com marcadores na observação:
   conta fixa  -> [conta-casa] [recorrente] [vencimento=DD] [primeira-parcela=AAAA-MM]  (Valor = previsto)
   pagamento   -> [conta-casa] [pago] [primeira-parcela=AAAA-MM]                       (Valor = pago de fato) */
var H={sel:null,form:null,pay:null};
var HOUSE_CATS=["Aluguel","Condomínio","Luz","Água","Internet","Gás","IPTU","Telefone","Streaming","Faxina","Outros"];
function isHouse(r){return /\[conta-casa\]/.test(r.notes);}
function houseTemplates(){return S.rows.filter(function(r){return r.amount<0&&isHouse(r)&&isRec(r)&&firstMonth(r)!=null});}
function housePayments(){return S.rows.filter(function(r){return r.amount<0&&isHouse(r)&&/\[pago\]/.test(r.notes)&&firstMonth(r)!=null});}
function dueDay(r){var m=r.notes.match(/\[vencimento=(\d{1,2})\]/);return m?+m[1]:null;}
function houseFor(i){
  var pays=housePayments().filter(function(p){return firstMonth(p)===i}),used={},out=[];
  houseTemplates().forEach(function(t){
    if(firstMonth(t)>i)return;
    var k=normKey(t.name),mine=pays.filter(function(p){return normKey(p.name)===k});
    mine.forEach(function(p){used[p.id]=1});
    var paid=mine.length>0;
    out.push({tpl:t,pays:mine,name:t.name,category:t.category||"Outros",due:dueDay(t),amount:paid?r2(mine.reduce(function(a,p){return a+Math.abs(p.amount)},0)):Math.abs(t.amount),expected:Math.abs(t.amount),paid:paid,projected:!paid});
  });
  pays.forEach(function(p){if(!used[p.id])out.push({tpl:null,pays:[p],name:p.name,category:p.category||"Outros",due:null,amount:Math.abs(p.amount),expected:Math.abs(p.amount),paid:true,projected:false});});
  return out;
}
function houseStatus(h,i){
  if(h.paid)return {t:"paga",c:"ok"};
  var now=nowIdx();
  if(i<now)return {t:"não paga",c:"late"};
  if(i===now&&h.due&&new Date().getDate()>h.due)return {t:"atrasada",c:"late"};
  return {t:"em aberto",c:""};
}
function houseRange(){
  var now=nowIdx(),start=now-5,end=now+3;
  houseTemplates().concat(housePayments()).forEach(function(r){start=Math.min(start,firstMonth(r));});
  start=Math.max(start,now-24);
  var a=[];for(var i=start;i<=end;i++)a.push(i);return a;
}
function houseCls(name){var ks=houseTemplates().map(function(t){return normKey(t.name)}),n=ks.indexOf(normKey(name));return "c"+(((n<0?ks.length:n)%8)+1);}
function houseHTML(){
  var all=houseRange();
  if(H.sel==null||all.indexOf(H.sel)<0)H.sel=Math.min(Math.max(nowIdx(),all[0]),all[all.length-1]);
  var i=H.sel,hs=houseFor(i);
  if(!houseTemplates().length&&!housePayments().length)return '<section class="card start"><span class="pill">Nenhuma conta ainda</span><h2>Aluguel e contas de casa</h2><p>Cadastre aluguel, condomínio, luz, água, internet e outras contas que não passam pelo cartão. Elas aparecem todo mês com o vencimento; quando pagar, marque e informe o valor real. Tudo fica registrado na planilha Google, aba Lancamentos.</p><button class="btn primary" data-act="hform">+ Conta da casa</button></section>';
  var tot=r2(hs.reduce(function(a,h){return a+h.amount},0)),paid=r2(hs.filter(function(h){return h.paid}).reduce(function(a,h){return a+h.amount},0)),left=r2(tot-paid);
  var late=hs.filter(function(h){return houseStatus(h,i).c==="late"}).length;
  var next=hs.filter(function(h){return !h.paid&&h.due}).sort(function(a,b){return a.due-b.due})[0];
  var hero='<section class="card hero"><div class="top2"><div class="l"><div class="nav"><button data-act="hprev"'+(i<=all[0]?' disabled':'')+' aria-label="Mês anterior">‹</button><h2 class="mtitle">'+mname(i)+'</h2><button data-act="hnext"'+(i>=all[all.length-1]?' disabled':'')+' aria-label="Próximo mês">›</button></div><span class="pill">Contas da casa no mês</span><div class="big num">'+BRL.format(tot)+'</div><div class="sub">'+hs.length+' conta'+(hs.length===1?'':'s')+(late?' · <b class="exp-t">'+late+' atrasada'+(late===1?'':'s')+'</b>':'')+'</div></div></div><div class="people">'
    +'<div class="person cinc"><div class="n"><span class="dot"></span>Pago</div><div class="v num">'+BRL.format(paid)+'</div><div class="bar"><i style="width:'+(tot?Math.round(paid/tot*100):0)+'%"></i></div><div class="s num">'+(tot?Math.round(paid/tot*100):0)+'% do mês</div></div>'
    +'<div class="person cexp"><div class="n"><span class="dot"></span>Falta pagar</div><div class="v num">'+BRL.format(left)+'</div><div class="s">'+(next?'próxima: '+esc(next.name)+' dia '+next.due:(left?'':'tudo pago'))+'</div></div>'
    +'</div></section>';
  var data=all.map(function(m){var x=houseFor(m);return {i:m,hs:x,t:r2(x.reduce(function(a,h){return a+h.amount},0))}});
  var mx=Math.max.apply(null,data.map(function(d){return d.t}).concat([1]));
  var chart='<section class="card"><div class="ch"><h2>Contas da casa mês a mês</h2></div><div class="plot" id="hplot">'+data.map(function(d){
    var segs=d.hs.map(function(h){return '<i class="'+houseCls(h.name)+(h.paid?'':' pr')+'" style="height:'+Math.max(2,h.amount/mx*200)+'px" title="'+esc(h.name)+': '+BRL.format(h.amount)+(h.paid?' (paga)':' (prevista)')+'"></i>'}).join("");
    return '<button class="col'+(d.i===i?' sel':'')+'" data-act="hsel" data-i="'+d.i+'"><span class="tot num">'+(d.t?N0.format(d.t):'–')+'</span><div class="stack">'+segs+'</div><span class="lbl">'+mshort(d.i)+'</span></button>';
  }).join("")+'</div><div class="legend">'+houseTemplates().map(function(t){return '<span class="'+houseCls(t.name)+'"><i class="dot"></i>'+esc(t.name)+'</span>'}).join("")+'<span><i class="hatch"></i>Listrado = ainda não pago</span></div></section>';
  var rowHTML=function(h){
    var st=houseStatus(h,i),id=h.tpl?h.tpl.id:h.pays[0].id,open=S.open["H"+id];
    var meta='<span class="tag">'+esc(h.category)+'</span>'+(h.due?'<span class="tag">vence dia '+h.due+'</span>':'')+'<span class="tag'+(st.c==="late"?' late':'')+(st.c==="ok"?' on':'')+'">'+st.t+'</span>'+(h.paid&&h.tpl&&Math.abs(h.amount-h.expected)>0.009?'<span class="tag">previsto '+BRL.format(h.expected)+'</span>':'');
    var btn=h.paid?'<button class="o cinc on" data-act="hunpay" data-id="'+esc(id)+'" title="Desfazer pagamento">Paga ✓</button>':'<button class="o" data-act="hpay" data-id="'+esc(id)+'">Pagar</button>';
    var det=open?'<div class="det">'+h.pays.map(function(p){return '<div><span class="dn">Pago em '+esc(p.date.split("-").reverse().join("/"))+(p.account?' · '+esc(p.account):'')+'</span><span class="da num">'+BRL.format(Math.abs(p.amount))+'</span></div>'}).join("")+(h.tpl?'<div><span class="dn">Valor previsto '+BRL.format(h.expected)+(h.tpl.account?' · paga pela conta '+esc(h.tpl.account):'')+'</span><span class="da"><button data-act="hedit" data-id="'+esc(h.tpl.id)+'">editar conta</button><button data-act="hdel" data-id="'+esc(h.tpl.id)+'">excluir conta</button></span></div>':'')+'</div>':'';
    return '<div class="grp"><div class="row"><div class="nm"><div class="t"><span class="dot '+houseCls(h.name)+'"></span><button data-act="open" data-g="H'+esc(id)+'" aria-expanded="'+!!open+'">'+esc(h.name)+'</button></div><div class="m">'+meta+'</div></div><div class="amt num">'+BRL.format(h.amount)+'</div><span class="owners">'+btn+'</span></div>'+det+'</div>';
  };
  /* Pagas em cima; abaixo, as que faltam pagar, por dia de vencimento. */
  var byDue=function(a,b){return (a.due||99)-(b.due||99)};
  var paidL=hs.filter(function(h){return h.paid}).sort(byDue),openL=hs.filter(function(h){return !h.paid}).sort(byDue);
  var block=function(title,cls,list,empty){return '<div class="hsec"><div class="hsec-h '+cls+'"><span class="dot"></span><b>'+title+'</b><span class="tag">'+list.length+'</span><span class="num">'+BRL.format(r2(list.reduce(function(a,h){return a+h.amount},0)))+'</span></div>'+(list.length?list.map(rowHTML).join(""):'<div class="empty sm">'+empty+'</div>')+'</div>';};
  var rows=hs.length?block("Pagas","cinc",paidL,"Nenhuma paga ainda neste mês.")+block("Faltam pagar","cexp",openL,"Tudo pago neste mês."):"";
  var list='<section class="card"><div class="lh"><h2>Contas de '+mname(i)+'</h2><button class="btn sm" data-act="hform">+ Conta da casa</button></div>'+(rows||'<div class="empty">Nenhuma conta neste mês.</div>')+'</section>';
  var y12=[];for(var m=i-11;m<=i;m++)y12=y12.concat(houseFor(m).filter(function(h){return h.paid}));
  var cats='<section class="card"><div class="ch"><h2>Quanto a casa custa</h2><span class="sub">pago nos últimos 12 meses</span></div>'+hbarsHTML(sumBy(y12,function(h){return h.name}))+'</section>';
  return hero+chart+list+cats;
}
function houseFormHTML(){
  var t=H.form.tpl,edit=!!t,first=t?mid(firstMonth(t)):mid(H.sel!=null?H.sel:nowIdx());
  var fy=+first.slice(0,4),fm=+first.slice(5,7),ys="";for(var a=fy-3;a<=fy+2;a++)ys+='<option value="'+a+'"'+(a===fy?' selected':'')+'>'+a+'</option>';
  var mos=MESES.map(function(n,j){return '<option value="'+(j+1)+'"'+(j+1===fm?' selected':'')+'>'+n.charAt(0).toUpperCase()+n.slice(1)+'</option>'}).join("");
  return '<div class="ov"><form class="dlg" id="hf" role="dialog" aria-modal="true" aria-label="Conta da casa"><h3>'+(edit?'Editar conta':'Nova conta da casa')+'</h3><div class="two"><label>Nome<input id="h-name" required value="'+esc(t?t.name:"")+'" placeholder="Ex.: Aluguel, Luz, Internet"></label><label>Categoria<input id="h-cat" list="hcats" value="'+esc(t?t.category:"Aluguel")+'"><datalist id="hcats">'+HOUSE_CATS.map(function(c){return '<option value="'+esc(c)+'">'}).join("")+'</datalist></label></div><div class="two"><label>Valor previsto (R$)<input id="h-amt" required inputmode="decimal" value="'+(t?String(Math.abs(t.amount)).replace(".",","):"")+'" placeholder="0,00"></label><label>Dia do vencimento<input id="h-due" inputmode="numeric" value="'+(t&&dueDay(t)?dueDay(t):"")+'" placeholder="10"></label></div><label>Paga pela conta<input id="h-acc" list="haccs" value="'+esc(t?t.account:"Banco do Brasil")+'"><datalist id="haccs">'+ACCOUNTS.map(function(c){return '<option value="'+esc(c)+'">'}).join("")+'</datalist></label><div class="two"><label>Começa em<select id="h-fm">'+mos+'</select></label><label>Ano<select id="h-fy">'+ys+'</select></label></div><div class="sub">Para luz, água e gás, use a média como valor previsto; ao pagar você informa o valor real do mês.</div><div class="foot"><button type="button" class="btn" data-act="cancel">Cancelar</button><button class="btn primary" type="submit">Gravar</button></div></form></div>';
}
function submitHouse(){
  var name=$("#h-name").value.trim(),amt=parseAmount($("#h-amt").value),due=parseInt($("#h-due").value,10);
  if(!name||isNaN(amt)||amt<=0){toast("Preencha nome e valor previsto.");return;}
  if(!(due>=1&&due<=31))due=null;
  var first=$("#h-fy").value+"-"+pad($("#h-fm").value);
  var row={date:first+"-"+pad(due||1),name:name,category:$("#h-cat").value.trim()||"Outros",account:$("#h-acc").value.trim(),amount:-r2(amt),person:BASE[0],card:"",status:"Debito",parcelas:1,notes:"[conta-casa] [recorrente]"+(due?" [vencimento="+due+"]":"")+" [primeira-parcela="+first+"]"};
  var old=H.form.tpl;
  if(old){
    var oldKey=normKey(old.name),pays=normKey(name)===oldKey?[]:housePayments().filter(function(p){return normKey(p.name)===oldKey});
    var add=[row].concat(pays.map(function(p){return Object.assign({},p,{name:name})}));
    if(commit([old].concat(pays),add)){H.form=null;toast("Conta atualizada.");}
  }else if(commit([],[row])){H.form=null;toast("Conta gravada.");}
  render();
}
function housePayFormHTML(){
  var t=S.rows.find(function(r){return r.id===H.pay.id});if(!t)return "";
  var i=H.pay.month,date=i===nowIdx()?todayISO():mid(i)+"-"+pad(Math.min(dueDay(t)||5,28));
  return '<div class="ov"><form class="dlg" id="hpf" role="dialog" aria-modal="true" aria-label="Pagar conta"><h3>Pagar '+esc(t.name)+'</h3><div class="sub">'+mname(i)+'</div><div class="two"><label>Valor pago (R$)<input id="hp-amt" required inputmode="decimal" value="'+String(Math.abs(t.amount)).replace(".",",")+'"></label><label>Data do pagamento<input id="hp-date" type="date" value="'+date+'"></label></div><label>Conta<input id="hp-acc" list="haccs2" value="'+esc(t.account||"")+'"><datalist id="haccs2">'+ACCOUNTS.map(function(c){return '<option value="'+esc(c)+'">'}).join("")+'</datalist></label><div class="foot"><button type="button" class="btn" data-act="cancel">Cancelar</button><button class="btn primary" type="submit">Marcar como paga</button></div></form></div>';
}
function submitHousePay(){
  var t=S.rows.find(function(r){return r.id===H.pay.id});if(!t){H.pay=null;render();return;}
  var amt=parseAmount($("#hp-amt").value);if(isNaN(amt)||amt<=0){toast("Informe o valor pago.");return;}
  var m=mid(H.pay.month);
  var row={date:$("#hp-date").value||todayISO(),name:t.name,category:t.category,account:$("#hp-acc").value.trim(),amount:-r2(amt),person:t.person||BASE[0],card:"",status:"Debito",parcelas:1,notes:"[conta-casa] [pago] [primeira-parcela="+m+"]"};
  if(commit([],[row])){H.pay=null;toast(t.name+" paga.");}
  render();
}

/* ---------- eventos ---------- */
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");
  if(!el){ if(ev.target.classList&&ev.target.classList.contains("ov")){closeAll();render();} return; }
  var a=el.getAttribute("data-act"),d=el.dataset;
  if(a==="tab"){S.tab=d.t;try{history.replaceState(null,"",d.t==="fatura"?location.pathname:"#"+d.t)}catch(e){}render();window.scrollTo&&window.scrollTo({top:0});return;}
  if(a==="card"){S.card=d.c;S.filter="all";S.scroll=null;saveLocal();var ra=range();if(ra.indexOf(S.sel)<0)S.sel=Math.min(Math.max(nowIdx(),ra[0]),ra[ra.length-1]);render();return;}
  if(a==="invpay"){var ti=0;entriesFor(S.sel).forEach(function(e){ti+=e.amount});S.invPay={card:S.card,month:S.sel,total:r2(ti)};render();var ia=$("#iv-amt");if(ia){ia.focus();ia.select();}return;}
  if(a==="invunpay"){if(el.dataset.sure){var ip=S.rows.find(function(x){return x.id===d.id});if(ip&&commit([ip],[]))toast("Pagamento desfeito.");render();return;}el.dataset.sure="1";el.textContent="confirmar";return;}
  if(a==="hform"){H.form={tpl:null};render();var hn=$("#h-name");if(hn)hn.focus();return;}
  if(a==="hedit"){H.form={tpl:S.rows.find(function(x){return x.id===d.id})||null};render();return;}
  if(a==="hdel"){if(el.dataset.sure){var ht=S.rows.find(function(x){return x.id===d.id});if(ht&&commit([ht],[]))toast("Conta excluída. Os pagamentos antigos continuam no histórico.");render();return;}el.dataset.sure="1";el.textContent="confirmar (os pagamentos ficam)";return;}
  if(a==="hpay"){H.pay={id:d.id,month:H.sel};render();var ha=$("#hp-amt");if(ha){ha.focus();ha.select();}return;}
  if(a==="hunpay"){var hh=houseFor(H.sel).find(function(h){return (h.tpl&&h.tpl.id===d.id)||(!h.tpl&&h.pays[0].id===d.id)});if(hh&&hh.pays.length&&commit(hh.pays,[]))toast("Pagamento desfeito.");render();return;}
  if(a==="hprev"||a==="hnext"){H.sel+=a==="hnext"?1:-1;render();return;}
  if(a==="hsel"){H.sel=+d.i;render();return;}
  if(a==="incform"){R.form=true;render();var inn=$("#i-name");if(inn)inn.focus();return;}
  if(a==="iprev"||a==="inext"){R.sel+=a==="inext"?1:-1;render();return;}
  if(a==="isel"){R.sel=+d.i;render();return;}
  if(a==="irec"){var rr=S.rows.find(function(x){return x.id===d.id});if(rr)changeRows([rr],function(r){r.notes=setMarker(r.notes,"[recorrente]",!isRec(r))});render();return;}
  if(a==="idel"){if(el.dataset.sure){deleteRow(d.id);render();return;}el.dataset.sure="1";el.textContent="confirmar exclusão";return;}
  if(a==="rprev"||a==="rnext"){R.rsel+=a==="rnext"?1:-1;render();return;}
  if(a==="rsel"){R.rsel=+d.i;render();return;}
  if(a==="rscope"){R.scope=d.v;render();return;}
  if(a==="rperson"){R.person=d.p;render();return;}
  if(a==="loanform"){L.form={loan:null};render();var ln=$("#l-name");if(ln)ln.focus();return;}
  if(a==="ledit"){L.form={loan:L.list.find(function(x){return x.id===d.id})||null};render();return;}
  if(a==="ldel"){if(el.dataset.sure){deleteLoan(d.id);render();return;}el.dataset.sure="1";el.textContent="confirmar exclusão";return;}
  if(a==="lpay"){togglePaid(d.id,L.sel);render();return;}
  if(a==="lprev"||a==="lnext"){var la=loanRange(),ln2=L.sel+(a==="lnext"?1:-1);if(ln2>=la[0]&&ln2<=la[la.length-1]){L.sel=ln2;L.scroll=null;render();}return;}
  if(a==="lsel"){L.sel=+d.i;render();return;}
  if(a==="pick"){$("#file").click();return;}
  if(a==="xlsx"){exportXlsx();return;}
  if(a==="pxlsx"){exportPerson(d.p);return;}
  if(a==="pcopy"){copyPerson(d.p);return;}
  if(a==="copytxt"){var t=$("#txt");if(t){t.select();try{navigator.clipboard.writeText(t.value).then(function(){toast("Texto copiado.")},function(){toast("Selecione o texto e copie.")});}catch(e){toast("Selecione o texto e copie.");}}return;}
  if(a==="prev"||a==="next"){var all=range(),n=S.sel+(a==="next"?1:-1);if(n>=all[0]&&n<=all[all.length-1]){S.sel=n;S.filter="all";S.scroll=null;render();}return;}
  if(a==="sel"){S.sel=+d.i;S.filter="all";render();window.scrollTo&&window.scrollTo({top:0,behavior:"smooth"});return;}
  if(a==="view"){S.view=d.v;render();return;}
  if(a==="filter"){S.filter=d.f;render();return;}
  if(a==="owner"){setOwner(d.g,d.p);render();return;}
  if(a==="newp"){S.newp={g:d.g};render();var inp=$("#np-name");if(inp)inp.focus();return;}
  if(a==="kind"){setKind(d.g);render();return;}
  if(a==="allnone"){assignAllNone(d.p);render();return;}
  if(a==="open"){S.open[d.g]=!S.open[d.g];render();return;}
  if(a==="del"){
    if(el.dataset.sure){deleteRow(d.id);render();return;}
    el.dataset.sure="1";el.textContent="confirmar exclusão";return;
  }
  if(a==="addform"){S.form=true;render();var mn=$("#m-name");if(mn)mn.focus();return;}
  if(a==="pessoas"){S.pessoas=true;render();return;}
  if(a==="remp"){removePerson(d.p);render();return;}
  if(a==="cancel"){closeAll();render();return;}
  if(a==="confirm"){confirmImport();return;}
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.id==="file"){handleFile(t.files);t.value="";return;}
  if(S.pending&&(t.id==="imp-m"||t.id==="imp-y"||t.id==="imp-card")){
    S.pending.month=$("#imp-y").value+"-"+pad($("#imp-m").value);
    S.pending.card=($("#imp-card").value||"").trim()||"Nubank";
    render();return;
  }
  if(t.id==="m-kind"){$("#m-par").hidden=t.value!=="parcelado";}
});
document.addEventListener("submit",function(ev){
  var id=ev.target.id;
  if(id==="invf"){ev.preventDefault();submitInvoicePay();return;}
  if(id==="hf"){ev.preventDefault();submitHouse();return;}
  if(id==="hpf"){ev.preventDefault();submitHousePay();return;}
  if(id==="incf"){ev.preventDefault();submitIncome();return;}
  if(id==="avgf"){ev.preventDefault();var av=parseAmount($("#avg-v").value);if(isNaN(av)||av<0){toast("Valor inválido.");return;}S.gabiAvg=r2(av);saveLocal();toast("Média do "+GABI+" salva.");render();return;}
  if(id==="pwf"){ev.preventDefault();var f=S.askPass&&S.askPass.file,pw=$("#pw").value;if(f)handleFile(f,pw);}
  else if(id==="loanf"){ev.preventDefault();submitLoan();}
  else if(id==="addf"){ev.preventDefault();addManual();}
  else if(id==="newpf"){ev.preventDefault();var n=addPerson($("#np-name").value);if(n&&S.newp){var g=S.newp.g;S.newp=null;var rows=groupRows(g);if(!rows.every(function(r){return r.person===n}))setOwner(g,n);render();}}
  else if(id==="addpf"){ev.preventDefault();var n2=addPerson($("#ap-name").value);if(n2){render();var i2=$("#ap-name");if(i2)i2.focus();}}
});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&(S.invPay||H.form||H.pay||R.form||S.askPass||L.form||S.pending||S.form||S.pessoas||S.newp||S.text)){closeAll();render();}});
var dc=0;
window.addEventListener("dragenter",function(e){if(e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],"Files")>-1){dc++;$("#drop").hidden=false;}});
window.addEventListener("dragleave",function(){dc=Math.max(0,dc-1);if(!dc)$("#drop").hidden=true;});
window.addEventListener("dragover",function(e){e.preventDefault();});
window.addEventListener("drop",function(e){e.preventDefault();dc=0;$("#drop").hidden=true;var fl=e.dataTransfer&&e.dataTransfer.files;if(fl&&fl.length)handleFile(fl);});

document.addEventListener("DOMContentLoaded",init);
})();
